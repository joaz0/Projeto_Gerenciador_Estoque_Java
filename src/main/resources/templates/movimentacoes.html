<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentações de Estoque - StockManager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-[#44474d] text-white flex flex-col justify-between shadow-xl">
            <div>
                <div class="p-5 border-b border-gray-600 flex items-center space-x-3">
                    <i class="fa-solid fa-boxes-stacked text-2xl text-emerald-400"></i>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">StockManager</h1>
                        <span class="text-xs text-gray-400">Gestão Web &bull; Cloud</span>
                    </div>
                </div>

                <nav class="mt-6 px-4 space-y-2">
                    <a href="/" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition">
                        <i class="fa-solid fa-chart-pie w-5"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="/produtos" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition">
                        <i class="fa-solid fa-box-open w-5"></i>
                        <span>Produtos</span>
                    </a>
                    <a href="/movimentacoes" class="flex items-center space-x-3 px-4 py-3 rounded-lg bg-emerald-600 text-white font-medium shadow-md transition">
                        <i class="fa-solid fa-right-left w-5"></i>
                        <span>Movimentações</span>
                    </a>
                    <a href="/relatorios" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition">
                        <i class="fa-solid fa-file-waveform w-5"></i>
                        <span>Relatórios</span>
                    </a>
                </nav>
            </div>

            <div class="p-4 border-t border-gray-600 text-xs text-gray-400 text-center">
                <p>Spring Boot &bull; Supabase &bull; Render</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <header class="bg-white shadow-sm p-4 flex justify-between items-center px-8">
                <h2 class="text-2xl font-bold text-gray-700">Entradas e Saídas de Estoque</h2>
                <div class="flex items-center space-x-3">
                    <button onclick="abrirModalMovimentacao('ENTRADA')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-semibold shadow flex items-center space-x-2 transition text-sm">
                        <i class="fa-solid fa-arrow-down"></i>
                        <span>Registrar Entrada</span>
                    </button>
                    <button onclick="abrirModalMovimentacao('SAIDA')" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg font-semibold shadow flex items-center space-x-2 transition text-sm">
                        <i class="fa-solid fa-arrow-up"></i>
                        <span>Registrar Saída</span>
                    </button>
                </div>
            </header>

            <div class="p-8 max-w-7xl mx-auto space-y-6">
                <!-- Movement History Table -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                        <h3 class="font-bold text-gray-700">Histórico de Movimentações</h3>
                        <span id="contador-movimentacoes" class="text-xs font-semibold text-gray-500">0 registros</span>
                    </div>

                    <table class="w-full text-left text-sm">
                        <thead class="bg-white text-gray-500 uppercase text-xs font-semibold border-b border-gray-200">
                            <tr>
                                <th class="py-3 px-6">ID</th>
                                <th class="py-3 px-6">Tipo</th>
                                <th class="py-3 px-6">Produto</th>
                                <th class="py-3 px-6 text-center">Quantidade</th>
                                <th class="py-3 px-6">Motivo</th>
                                <th class="py-3 px-6 text-right">Data / Hora</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-movimentacoes" class="divide-y divide-gray-100">
                            <tr><td colspan="6" class="text-center py-6 text-gray-400">Carregando movimentações...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Movimentação (Entrada / Saída) -->
    <div id="modal-movimentacao" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <div id="modal-mov-header" class="px-6 py-4 flex justify-between items-center text-white bg-emerald-600">
                <h3 id="modal-mov-titulo" class="font-bold text-lg flex items-center space-x-2">
                    <i class="fa-solid fa-right-left"></i>
                    <span>Registrar Entrada</span>
                </h3>
                <button onclick="fecharModalMovimentacao()" class="text-white text-xl">&times;</button>
            </div>

            <form id="form-movimentacao" onsubmit="enviarMovimentacao(event)" class="p-6 space-y-4">
                <input type="hidden" id="mov-tipo" value="ENTRADA">

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Selecione o Produto *</label>
                    <select id="mov-produto" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="">Carregando produtos...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Quantidade *</label>
                    <input type="number" id="mov-quantidade" min="1" required placeholder="Ex: 5"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Motivo / Observação</label>
                    <input type="text" id="mov-motivo" placeholder="Ex: Reposição de estoque, venda balcão..."
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="fecharModalMovimentacao()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-50 transition">
                        Cancelar
                    </button>
                    <button type="submit" id="btn-submit-mov" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold shadow transition">
                        Confirmar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let produtosCache = [];

        async function carregarProdutosNoSelect() {
            try {
                const res = await fetch('/api/produtos');
                if (res.ok) {
                    produtosCache = await res.json();
                    const select = document.getElementById('mov-produto');
                    select.innerHTML = '<option value="">-- Escolha um produto --</option>' + 
                        produtosCache.map(p => `<option value="${p.id}">${p.nome} (Saldo atual: ${p.quantidadeEstoque} un)</option>`).join('');
                }
            } catch (err) {
                console.error("Erro ao carregar produtos:", err);
            }
        }

        async function carregarMovimentacoes() {
            try {
                const res = await fetch('/api/movimentacoes');
                if (res.ok) {
                    const lista = await res.json();
                    document.getElementById('contador-movimentacoes').innerText = `${lista.length} registros`;

                    const tbody = document.getElementById('tabela-movimentacoes');
                    if (lista.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-gray-400">Nenhuma movimentação registrada até o momento.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = lista.map(m => `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="py-3 px-6 text-gray-400 font-mono text-xs">#${m.id}</td>
                            <td class="py-3 px-6">
                                <span class="px-2.5 py-1 rounded-md text-xs font-bold ${m.tipo === 'ENTRADA' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                    <i class="fa-solid ${m.tipo === 'ENTRADA' ? 'fa-arrow-down' : 'fa-arrow-up'} mr-1"></i>
                                    ${m.tipo}
                                </span>
                            </td>
                            <td class="py-3 px-6 font-semibold text-gray-800">${m.produtoNome}</td>
                            <td class="py-3 px-6 text-center font-bold text-gray-700">${m.quantidade} un</td>
                            <td class="py-3 px-6 text-gray-500 text-xs">${m.motivo || '-'}</td>
                            <td class="py-3 px-6 text-right text-xs text-gray-500">${new Date(m.dataMovimentacao).toLocaleString('pt-BR')}</td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error("Erro ao carregar movimentações:", err);
            }
        }

        function abrirModalMovimentacao(tipo) {
            document.getElementById('mov-tipo').value = tipo;
            document.getElementById('form-movimentacao').reset();

            const header = document.getElementById('modal-mov-header');
            const titulo = document.getElementById('modal-mov-titulo');
            const btn = document.getElementById('btn-submit-mov');

            if (tipo === 'ENTRADA') {
                header.className = 'px-6 py-4 flex justify-between items-center text-white bg-emerald-600';
                titulo.innerHTML = '<i class="fa-solid fa-arrow-down mr-2"></i> Registrar Entrada de Estoque';
                btn.className = 'px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold shadow transition';
            } else {
                header.className = 'px-6 py-4 flex justify-between items-center text-white bg-rose-600';
                titulo.innerHTML = '<i class="fa-solid fa-arrow-up mr-2"></i> Registrar Saída / Baixa de Estoque';
                btn.className = 'px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-sm font-semibold shadow transition';
            }

            document.getElementById('modal-movimentacao').classList.remove('hidden');
        }

        function fecharModalMovimentacao() {
            document.getElementById('modal-movimentacao').classList.add('hidden');
        }

        async function enviarMovimentacao(event) {
            event.preventDefault();
            const tipo = document.getElementById('mov-tipo').value;
            const produtoId = parseInt(document.getElementById('mov-produto').value);
            const quantidade = parseInt(document.getElementById('mov-quantidade').value);
            const motivo = document.getElementById('mov-motivo').value;

            const endpoint = tipo === 'ENTRADA' ? '/api/movimentacoes/entrada' : '/api/movimentacoes/saida';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ produtoId, quantidade, motivo })
                });

                if (res.ok) {
                    fecharModalMovimentacao();
                    await carregarMovimentacoes();
                    await carregarProdutosNoSelect();
                } else {
                    const err = await res.json();
                    alert("Atenção: " + (err.message || err.error || "Erro ao processar movimentação."));
                }
            } catch (err) {
                alert("Erro ao conectar à API.");
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarProdutosNoSelect();
            await carregarMovimentacoes();

            // Pré-seleciona produto se vindo por query param (?produtoId=...)
            const urlParams = new URLSearchParams(window.location.search);
            const preSelected = urlParams.get('produtoId');
            if (preSelected) {
                abrirModalMovimentacao('ENTRADA');
                document.getElementById('mov-produto').value = preSelected;
            }
        });
    </script>
</body>
</html>
