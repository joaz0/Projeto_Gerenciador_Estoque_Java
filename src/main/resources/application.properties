# ========================================================
# Configurações do Spring Boot - Gerenciador de Estoque
# ========================================================

# Porta da aplicação (Render injeta a variável PORT dinamicamente)
server.port=${PORT:8080}

# ========================================================
# Conexão com o Banco de Dados PostgreSQL (Supabase)
# ========================================================
# NOTA: O Supabase fornece a porta 6543 para o Transaction/Session Pooler (Supavisor / PgBouncer),
# prevenindo o esgotamento do limite de conexões no plano gratuito (Free Tier).
# Em produção (Render), estas propriedades são substituídas pelas Variáveis de Ambiente:
# - SPRING_DATASOURCE_URL
# - SPRING_DATASOURCE_USERNAME
# - SPRING_DATASOURCE_PASSWORD

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.sua_referencia_de_projeto}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sua_senha_do_supabase}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Pool de Conexões HikariCP otimizado para o Supabase Free Tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# ========================================================
# Configuração do Hibernate / Spring Data JPA
# ========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================================
# Thymeleaf
# ========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
