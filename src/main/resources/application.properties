# ========================================================
# Configurações do Spring Boot - Gerenciador de Estoque
# ========================================================

# Porta da aplicação (Render injeta a variável PORT dinamicamente)
server.port=${PORT:8080}

# ========================================================
# Conexão com o Banco de Dados PostgreSQL (Supabase)
# ========================================================
# NOTA IMPORTANTE PARA DEPLOY NO RENDER / SUPABASE:
# Para que a aplicação conecte ao seu banco de dados, você DEVE configurar
# as seguintes Variáveis de Ambiente no painel do Render (Environment):
#
#   SPRING_DATASOURCE_URL
#     Exemplo Pooler (Porta 6543 - Transaction):
#     jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
#     (Obs: prepareThreshold=0 é essencial para evitar erros de prepared statements no PgBouncer/Supavisor)
#     OU Exemplo Conexão Direta / Session Pooler (Porta 5432):
#     jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
#
#   SPRING_DATASOURCE_USERNAME
#     Exemplo Pooler: postgres.SEU_PROJECT_REF
#     Exemplo Direto: postgres
#
#   SPRING_DATASOURCE_PASSWORD
#     Sua senha do banco de dados no Supabase

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.epvlhidgkvczgelvjqsj}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Pool de Conexões HikariCP otimizado para o Supabase Free Tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# ========================================================
# Configuração do Hibernate / Spring Data JPA
# ========================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Dialeto explícito do PostgreSQL: necessário como fallback quando a conexão
# inicial falha (ex: credenciais inválidas), pois sem ele o Hibernate não
# consegue determinar o dialeto e lança um erro fatal adicional.
# O warning HHH90000025 é inofensivo e pode ser ignorado.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================================
# Thymeleaf
# ========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
